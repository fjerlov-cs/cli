fragment ActionDetails on Action{
    id
    name

    ... on EmailAction {
        recipients
        subjectTemplate
        emailBodyTemplate: bodyTemplate
        useProxy
        labels
    }

    ... on HumioRepoAction {
        ingestToken
        labels
    }

    ... on OpsGenieAction {
        apiUrl
        genieKey
        useProxy
        labels
    }

    ... on PagerDutyAction {
        severity
        routingKey
        useProxy
        labels
    }

    ... on SlackAction {
        url
        fields {
            fieldName
            value
        }
        useProxy
        labels
    }

    ... on SlackPostMessageAction {
        apiToken
        channels
        fields {
            fieldName
            value
        }
        useProxy
        labels
    }

    ... on VictorOpsAction {
        messageType
        notifyUrl
        useProxy
        labels
    }

    ... on UploadFileAction {
        fileName
        labels
    }

    ... on WebhookAction {
        method
        url
        headers {
            header
            value
        }
        WebhookBodyTemplate: bodyTemplate
        ignoreSSL
        useProxy
        labels
    }

    ... on S3Action {
        roleArn
        awsRegion
        bucketName
        fileName
        outputFormat
        outputMetadata
        useProxy
        labels
    }
}

