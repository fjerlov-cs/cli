query ListActions(
    $SearchDomainName: String!
) {
    searchDomain(
        name: $SearchDomainName
    ) {
        actions {
            ...ActionDetails
        }
    }
}

query ListActionsWithoutS3(
    $SearchDomainName: String!
) {
    searchDomain(
        name: $SearchDomainName
    ) {
        actions {
            ...ActionDetailsWithoutS3
        }
    }
}

query GetActionByID(
    $SearchDomainName: String!
    $ActionID: String!
) {
    searchDomain(
        name: $SearchDomainName
    ) {
        action(
            id: $ActionID
        ) {
            ...ActionDetails
        }
    }
}

mutation DeleteActionByID(
    $SearchDomainName: String!
    $ActionID: String!
) {
    deleteAction(input: {
        viewName: $SearchDomainName
        id: $ActionID
    })
}

mutation CreateEmailAction(
    $SearchDomainName: String!
    $ActionName: String!
    $Recipients: [String!]!
    $SubjectTemplate: String
    $BodyTemplate: String
    $UseProxy: Boolean!
    $Labels: [String!]
) {
    createEmailAction(input: {
        viewName: $SearchDomainName
        name: $ActionName
        recipients: $Recipients
        subjectTemplate: $SubjectTemplate
        bodyTemplate: $BodyTemplate
        useProxy: $UseProxy
        labels: $Labels
    }) {
        id
        name
        recipients
        subjectTemplate
        bodyTemplate
        useProxy
        labels
    }
}

mutation CreateHumioRepoAction(
