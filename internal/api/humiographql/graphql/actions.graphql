mutation CreateWebhookAction(
    $SearchDomainName: String!
    $ActionName: String!
    $Url: String!
    $Method: String!
    $Headers: [HttpHeaderEntryInput!]!
    $BodyTemplate: String!
    $IgnoreSSL: Boolean!
    $UseProxy: Boolean!
    $Labels: [String!]
) {
    createWebhookAction(input: {
        viewName: $SearchDomainName
        name: $ActionName
        url: $Url
        method: $Method
        headers: $Headers
        bodyTemplate: $BodyTemplate
        ignoreSSL: $IgnoreSSL
        useProxy: $UseProxy
        labels: $Labels
    }) {
        id
        name
        url
        method
        headers {
            value
            header
        }
        bodyTemplate
        ignoreSSL
        useProxy
        labels
    }
}

mutation CreateS3Action(
    $SearchDomainName: RepoOrViewName!
    $ActionName: String!
    $RoleArn: String!
    $AwsRegion: String!
    $BucketName: String!
    $FileName: String!
    $OutputFormat: S3ActionEventOutputFormat!
    $OutputMetadata: Boolean!
    $UseProxy: Boolean!
    $Labels: [String!]
) {
    createS3Action(input: {
        viewName: $SearchDomainName
        name: $ActionName
        roleArn: $RoleArn
        awsRegion: $AwsRegion
        bucketName: $BucketName
        fileName: $FileName
        outputFormat: $OutputFormat
        outputMetadata: $OutputMetadata
        useProxy: $UseProxy
        labels: $Labels
    }) {
        id
        name
        roleArn
        awsRegion
        bucketName
        fileName
        outputFormat
        outputMetadata
        useProxy
        labels
    }
}
